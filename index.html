<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111" />
    <title>Microlet Rush: Timor Streets</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden; /* Prevents page scroll */
        touch-action: none; /* Disables default touch gestures like scrolling/zoom */
        overscroll-behavior: none; /* Stops bounce on iOS */
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
      }
      .hud {
        position: fixed;
        left: 0; right: 0; top: 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        font-weight: 600;
        letter-spacing: 0.2px;
        pointer-events: none; /* Let canvas receive input */
      }
      .hud span { opacity: 0.95; }

      /* Name overlay */
      #name-overlay {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); z-index: 10000; pointer-events: auto;
      }
      #name-panel {
        width: min(92vw, 420px); padding: 16px 14px; background: #111; border: 2px solid #fff;
        color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
        border-radius: 8px; text-align: center;
      }
      #name-input { width: 100%; padding: 10px 12px; font-size: 18px; border-radius: 6px; border: 1px solid #333; }
      #name-button { margin-top: 12px; padding: 10px 14px; font-size: 16px; font-weight: 700; background: #ffd34d; border: none; border-radius: 6px; }
    </style>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div class="hud">
      <span id="hud-score">Score: 0</span>
      <span id="hud-target">Target:
        <img id="hud-target-img" alt="target microlet" style="height:32px; vertical-align:middle; margin-left:6px; image-rendering: pixelated;" />
      </span>
      <span id="hud-lives">Lives: 3</span>
    </div>

    <!-- Name prompt overlay -->
    <div id="name-overlay">
      <div id="name-panel">
        <div style="font-size:22px; font-weight:800; margin-bottom:10px;">Enter your name</div>
        <input id="name-input" type="text" maxlength="15" placeholder="Your name" autocomplete="name" />
        <div style="font-size:12px; opacity:0.8; margin-top:6px;">3–15 letters/numbers</div>
        <button id="name-button">Start</button>
      </div>
    </div>

    <!-- Scenes and bootstrap -->
    <script src="js/scenes/PreloadScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/lib/sound.js"></script>
    <script src="js/lib/leaderboard.js"></script>
    <script src="js/main.js"></script>

    <script>
      // Extra safety: prevent any default touchmove scrolling on the page
      window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
  </html>
